pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // The deprecated Google VR (Cardboard) SDK was only ever published to
        // JCenter, which JFrog keeps online as a read-only archive. Scope it to
        // just that group so no other dependency is pulled from this legacy host.
        maven {
            url 'https://jcenter.bintray.com/'
            content {
                includeGroup 'com.google.vr'
            }
        }
    }
}

rootProject.name = "MachineToBeAnother"
include ':app'
