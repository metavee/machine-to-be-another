# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX packages instead of the legacy android.support libraries.
android.useAndroidX=true
# The Google VR SDK (com.google.vr:sdk-base) still references the old
# android.support.* classes internally, so Jetifier rewrites them to AndroidX
# at build time. It can be removed once/if the VR dependency is replaced.
android.enableJetifier=true
