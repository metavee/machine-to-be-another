plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.metavee.machinetobeanother'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.metavee.machinetobeanother"
        // Raised from the original API 19 to the minimum supported by the modern
        // AndroidX libraries. Still covers essentially every device in use today.
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            // Real release-signing credentials are supplied through environment
            // variables in CI (see .github/workflows/android.yml). When they are
            // absent — local builds, or before any signing secrets are added to
            // the repo — the release build falls back to the debug signing key
            // below, so the produced APK is still installable for sideloading.
            def storeFilePath = System.getenv("RELEASE_STORE_FILE")
            if (storeFilePath) {
                storeFile file(storeFilePath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("RELEASE_KEY_ALIAS")
                keyPassword System.getenv("RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the real release key when its credentials are present,
            // otherwise sign with the debug key so the APK still installs.
            signingConfig System.getenv("RELEASE_STORE_FILE") ? signingConfigs.release : signingConfigs.getByName("debug")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildToolsVersion '34.0.0'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Stereo rendering and Cardboard viewer calibration are handled by a small
    // in-app renderer (see TextureTestActivity / CardboardProfile) — no VR SDK.
}
