name: Android CI

on:
  push:
    # "claude/**" is included so that pushes to the AI-assisted working
    # branches also produce a downloadable (debug) build (see the publish
    # steps below). Pushes to "main"/"master" instead cut a full release.
    branches: [ "master", "main", "claude/**" ]
  pull_request:
    branches: [ "master", "main" ]
  # Allow running the workflow manually from the Actions tab (available once
  # this workflow exists on the default branch).
  workflow_dispatch:

# "write" is required so the build can publish the APK as a GitHub Release asset.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Whether this run targets the default branch (a merge to main/master).
    # Such runs cut a full, versioned release from a signed release build.
    # Everything else (PRs, "claude/**" pushes, manual runs off a working
    # branch) produces a debug build and the rolling "debug-latest" pre-release.
    env:
      IS_RELEASE: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # ------------------------------------------------------------------
      # Debug build path — PRs, "claude/**" pushes and manual working-branch
      # runs. Publishes the rolling "debug-latest" pre-release for easy
      # sideloading of in-progress work.
      # ------------------------------------------------------------------
      - name: Build debug APK
        if: env.IS_RELEASE == 'false'
        run: ./gradlew assembleDebug --stacktrace

      - name: Give the debug APK a friendly name
        if: env.IS_RELEASE == 'false'
        run: cp app/build/outputs/apk/debug/app-debug.apk MachineToBeAnother-debug.apk

      - name: Upload debug APK as a workflow artifact
        if: env.IS_RELEASE == 'false'
        uses: actions/upload-artifact@v4
        with:
          # Downloadable (as a .zip) from the workflow run page under "Artifacts".
          name: MachineToBeAnother-debug-apk
          path: MachineToBeAnother-debug.apk
          if-no-files-found: error

      - name: Publish the debug APK to a rolling pre-release
        # Skip on pull_request builds; publish on working-branch pushes and
        # manual runs. Attaches the raw .apk to a GitHub pre-release so it can
        # be downloaded directly (no zip) for sideloading onto a phone.
        if: env.IS_RELEASE == 'false' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Recreate the rolling "debug-latest" pre-release so it points at this
          # commit and carries the freshly built APK as its only asset.
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest MachineToBeAnother-debug.apk \
            --title "Latest debug build" \
            --notes "Automated debug build from commit ${{ github.sha }}." \
            --prerelease \
            --target "${{ github.sha }}"

      # ------------------------------------------------------------------
      # Release build path — a merge to main/master. Builds a signed release
      # APK and publishes it as a full (non-pre) GitHub Release with a stable,
      # versioned tag.
      # ------------------------------------------------------------------
      - name: Build release APK
        if: env.IS_RELEASE == 'true'
        env:
          # Real release-signing credentials, if configured as repository
          # secrets. When RELEASE_STORE_FILE is unset the build signs with the
          # debug key instead (see app/build.gradle) so the APK still installs.
          RELEASE_STORE_FILE: ${{ secrets.RELEASE_STORE_FILE }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Give the release APK a friendly name
        if: env.IS_RELEASE == 'true'
        run: cp app/build/outputs/apk/release/app-release.apk MachineToBeAnother-release.apk

      - name: Upload release APK as a workflow artifact
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MachineToBeAnother-release-apk
          path: MachineToBeAnother-release.apk
          if-no-files-found: error

      - name: Work out the release version and tag
        if: env.IS_RELEASE == 'true'
        id: version
        run: |
          # Derive the human version from the app's versionName and make the tag
          # unique per build by appending the workflow run number, so repeated
          # merges each get their own release instead of colliding.
          version_name=$(grep -oP 'versionName\s+"\K[^"]+' app/build.gradle | head -n1)
          echo "tag=v${version_name}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "title=MachineToBeAnother ${version_name} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Publish the release APK to a full GitHub Release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A full (non-pre) release with a stable, versioned tag. --latest keeps
          # the repo's "Latest release" pointer on the newest build.
          gh release create "${{ steps.version.outputs.tag }}" MachineToBeAnother-release.apk \
            --title "${{ steps.version.outputs.title }}" \
            --notes "Automated release build from commit ${{ github.sha }}." \
            --latest \
            --target "${{ github.sha }}"
